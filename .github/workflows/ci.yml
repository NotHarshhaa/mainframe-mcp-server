name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
        # Integration tests are env-gated (RUN_INTEGRATION=1) and stay skipped in CI.

  docker:
    runs-on: ubuntu-latest
    # Image build smoke: catches Dockerfile breakage before release day.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mainframe-mcp-server:ci

      - name: Verify the image runs as non-root
        run: |
          USER=$(docker run --rm --entrypoint sh mainframe-mcp-server:ci -c 'id -u')
          if [ "$USER" = "0" ]; then
            echo "::error::Container image runs as root"
            exit 1
          fi
          echo "Image runs as uid $USER"
