name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # MCP registry: mcp-publisher login github-oidc

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify gates before publishing
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').packages[0].version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ]; then
            echo "::error::Tag v$TAG does not match package.json ($PKG) / server.json ($SRV)"
            exit 1
          fi
          echo "Releasing version $TAG"

      - name: Publish to npm (skipped when version already exists — rerun safe)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG@$VER" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VER" ]; then
            echo "$PKG@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher (official registry CLI)
        run: |
          curl -sL -o publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

      - name: Create GitHub release (notes from CHANGELOG + auto-generated commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          PKG=$(node -p "require('./package.json').name")

          # Extract this version's section from CHANGELOG.md (Keep a Changelog
          # format). Empty when the section is missing — --generate-notes
          # below still produces a full commit list.
          awk -v header="## [$VER]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Extracted CHANGELOG section for $VER ($(wc -l < release-notes.md) lines)"
          else
            echo "No CHANGELOG section for $VER — falling back to auto-generated notes only"
            : > release-notes.md
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes"
            gh release edit "$TAG" --title "$PKG v$VER" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$PKG v$VER" \
              --notes-file release-notes.md \
              --generate-notes
          fi

      - name: Release summary
        run: |
          echo "Published @notharshhaa/mainframe-mcp-server@${GITHUB_REF_NAME#v}"
          echo "- npm: https://www.npmjs.com/package/@notharshhaa/mainframe-mcp-server"
          echo "- MCP registry: https://registry.modelcontextprotocol.io"
