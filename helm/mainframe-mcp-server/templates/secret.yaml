{{- if .Values.credentials.create }}
{{- $secret := include "mainframe-mcp-server.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "mainframe-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.zosmf.token }}
  {{ .Values.credentials.tokenKey }}: {{ .Values.zosmf.token | quote }}
  {{- end }}
  {{- if .Values.zosmf.password }}
  {{ .Values.credentials.passwordKey }}: {{ .Values.zosmf.password | quote }}
  {{- end }}
  {{- if .Values.security.auditSplunkToken }}
  {{ .Values.credentials.splunkTokenKey }}: {{ .Values.security.auditSplunkToken | quote }}
  {{- end }}
  {{- if .Values.security.auditWebhookToken }}
  {{ .Values.credentials.webhookTokenKey }}: {{ .Values.security.auditWebhookToken | quote }}
  {{- end }}
{{- end }}
