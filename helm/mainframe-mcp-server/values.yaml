# Default values for mainframe-mcp-server.
# The server runs the SSE transport in Kubernetes (stdio requires an attached
# MCP client process, which does not fit a Deployment).

replicaCount: 1

image:
  # Official image — signed (Sigstore/cosign keyless) with an attached SBOM.
  repository: ghcr.io/notharshhaa/mainframe-mcp-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---- z/OSMF connection ----
zosmf:
  host: ""                 # required — or provide via existingSecret key ZOSMF_HOST
  port: 443
  basePath: ""
  # Token auth is recommended for Kubernetes (user/password also supported).
  token: ""
  tokenType: "LTPA2"
  user: ""
  password: ""
  rejectUnauthorized: "true"
  # Per-user identity via PassTicket propagation.
  userId: ""
  passticketApp: "ZOSMF"

# ---- Security & governance ----
security:
  readOnly: "true"          # safe default: no write tools
  auditLogging: "true"
  # Optional YAML policy file (roles/RBAC/environments/classifications).
  # Provide via `policy.existingConfigMap` (key policy.yaml) or inline below.
  policyFile: ""
  # SIEM sinks (choose any; file sink needs persistence.enabled)
  auditFile: ""
  auditSplunkUrl: ""
  auditSplunkToken: ""
  auditWebhookUrl: ""
  auditWebhookToken: ""
  auditOtlpUrl: ""
  dataProtection: "true"

# Policy file provisioning
policy:
  # Name of an existing ConfigMap containing a `policy.yaml` key.
  existingConfigMap: ""
  # Inline policy (rendered into a ConfigMap when existingConfigMap is empty).
  inline: ""

# ---- Credentials ----
# Provide sensitive values from an existing Secret (recommended), or let the
# chart create one from the values above (credentials.create=true).
credentials:
  create: true
  existingSecret: ""
  # Keys looked up in the existing secret (defaults shown):
  tokenKey: ZOSMF_TOKEN
  passwordKey: ZOSMF_PASSWORD
  splunkTokenKey: SECURITY_AUDIT_SPLUNK_TOKEN
  webhookTokenKey: SECURITY_AUDIT_WEBHOOK_TOKEN

mcp:
  transport: "sse"
  ssePort: 3000
  logLevel: "info"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  # The image runs as the `node` user (uid 1000) already.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

persistence:
  # Mount for the file audit sink (SECURITY_AUDIT_FILE) and /tmp.
  # Prefer remote SIEM sinks (Splunk/OTLP/webhook) in Kubernetes.
  enabled: false
  size: 1Gi
  mountPath: /data
  storageClass: ""

extraEnv: []
  # - name: EXTRA_VAR
  #   value: "value"

extraEnvFrom: []

nodeSelector: {}

tolerations: []

affinity: {}
